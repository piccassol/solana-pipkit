[package]
name = "solana-pipkit"
version = "2.0.0"
edition = "2021"
authors = ["Noah Michel <noah@arktechnologies.ai>"]
description = "Pragmatic Rust utilities for Solana development - safety, speed, analytics, and DeFi"
license = "MIT"
repository = "https://github.com/piccassol/solana-pipkit"
keywords = ["solana", "blockchain", "rust", "web3", "defi"]
categories = ["cryptography::cryptocurrencies"]
readme = "README.md"

[lib]
path = "src/lib.rs"

[[example]]
name = "rent_cleaner"
path = "examples/rent_cleaner.rs"

[[example]]
name = "token_burn"
path = "examples/token_burn.rs"

[[example]]
name = "wallet_profile"
path = "examples/wallet_profile.rs"

[[example]]
name = "pool_info"
path = "examples/pool_info.rs"

[dependencies]
solana-sdk = "1.18"
solana-client = "1.18"
solana-account-decoder = "1.18"
solana-transaction-status = "1.18"
spl-token = "4.0"
spl-associated-token-account = "2.3"
anchor-lang = { version = "0.29", optional = true }
anchor-spl = { version = "0.29", optional = true }
mpl-token-metadata = "4.1"
tokio = { version = "1.36", features = ["full"] }
borsh = "1.3"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
bs58 = "0.5"
lazy_static = "1.4"
base64 = "0.21"
aes-gcm = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true } 

# Jupiter integration
reqwest = { version = "0.11", features = ["json"], optional = true }

# Jito integration
jito-protos = { package = "carbon-jito-protos", version = "0.2.4", optional = true }
tonic = { version = "0.10", optional = true }

# Add shellexpand dependency (missing)
shellexpand = "3.0"
futures = "0.3"
futures-util = { version = "0.3", optional = true }
tokio-tungstenite = { version = "0.20", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[features]
# Enable jupiter and safety by default since examples use them
default = ["jupiter", "safety"]
anchor = ["anchor-lang", "anchor-spl"]
jupiter = ["reqwest"]
jito = ["jito-protos", "tonic"]
analytics = []
defi = []
safety = []
speed = ["jito"]
multi-agent = ["aes-gcm", "tokio-tungstenite", "futures-util", "rand"]
agent-analytics = []
all = ["anchor", "jupiter", "jito", "analytics", "defi", "safety", "speed", "multi-agent", "agent-analytics"]
